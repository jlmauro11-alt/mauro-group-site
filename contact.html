<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Mauro Group</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Background video -->
  <div class="bg">
    <video autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Navigation -->
  <header class="nav">
    <a class="brand" href="index.html">The Mauro Group</a>
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="investments.html">Investments</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Content -->
  <main class="wrap">
    <section class="panel">
      <h1>Contact</h1>
      <p class="sub">
        Send a note and we’ll respond quickly. If you have a deck or brief, include a link.
      </p>

      <!-- Contact inputs -->
      <div class="form">
        <div>
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your name" />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@company.com" />
        </div>

        <div class="full">
          <label for="message">Message</label>
          <textarea id="message" placeholder="What can we help with?"></textarea>
        </div>

        <div class="full actions">
          <a class="btn primary" id="sendEmail" href="mailto:private0@themaurogroup.com">
            Send Email
          </a>
          <span class="hint">
            This opens your email app and sends directly to private0@themaurogroup.com.
          </span>
        </div>
      </div>
    </section>
  </main>

  <!-- Safe mailto builder (Safari-compatible) -->
  <script>
    (function () {
      const to = "private0@themaurogroup.com";
      const link = document.getElementById("sendEmail");

      function enc(v) {
        return encodeURIComponent(v || "");
      }

      function updateMailto() {
        const name = document.getElementById("name")?.value || "";
        const email = document.getElementById("email")?.value || "";
        const message = document.getElementById("message")?.value || "";

        const subject = `Website inquiry${name ? " — " + name : ""}`;

        const body =
`Name: ${name}
Email: ${email}

Message:
${message}
`;

        link.href =
          `mailto:${to}?subject=${enc(subject)}&body=${enc(body)}`;
      }

      // Build the email link right before opening mail
      link.addEventListener("click", updateMailto);
    })();
  </script>
</body>
</html>
