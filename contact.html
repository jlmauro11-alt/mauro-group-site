<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Mauro Group</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Background video -->
  <div class="bg">
    <video autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Navigation -->
  <header class="nav">
    <a class="brand" href="index.html">The Mauro Group</a>
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="investments.html">Investments</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Content -->
  <main class="wrap">
    <section class="panel">
      <h1>Contact</h1>
      <p class="sub">
        Send a note and we’ll respond quickly. If you have a deck or brief, include a link.
      </p>

      <!-- PRODUCTION FORM (AJAX submit to Formspree, then redirect to your thank-you page) -->
      <form class="form" id="contactForm" method="POST" novalidate>
        <!-- Spam honeypot -->
        <div style="display:none;">
          <label>Leave this empty</label>
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
        </div>

        <!-- Subject line in the email you receive -->
        <input type="hidden" name="_subject" value="Mauro Group — Website inquiry" />

        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />
        </div>

        <div>
          <label for="email">Email</label>
          <!-- IMPORTANT: keep name="email" for autoresponses -->
          <input id="email" name="email" type="email" placeholder="you@company.com" required />
        </div>

        <div class="full">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="What can we help with?"
            required
          ></textarea>
        </div>

        <div class="full actions">
          <button class="btn primary" id="submitBtn" type="submit">Send</button>
          <span class="hint" id="formHint">Delivered securely to private0@themaurogroup.com.</span>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const endpoint = "https://formspree.io/f/mbdajwlr";
      const thankYouUrl = "/thank-you.html";

      const form = document.getElementById("contactForm");
      const btn = document.getElementById("submitBtn");
      const hint = document.getElementById("formHint");

      function setHint(text) {
        if (hint) hint.textContent = text;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          setHint("Please complete all required fields.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Sending…";
        setHint("Sending securely…");

        try {
          const formData = new FormData(form);

          const res = await fetch(endpoint, {
            method: "POST",
            body: formData,
            headers: { "Accept": "application/json" }
          });

          if (res.ok) {
            // Never show Formspree thank-you page.
            window.location.assign(thankYouUrl);
            return;
          }

          // If Formspree returns JSON errors, show a clean message.
          let data = null;
          try { data = await res.json(); } catch (_) {}

          if (data && data.errors && data.errors.length) {
            setHint(data.errors[0].message || "There was a problem sending your message.");
          } else {
            setHint("There was a problem sending your message. Please try again.");
          }
        } catch (err) {
          setHint("Network error. Please try again.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Send";
        }
      });
    })();
  </script>
</body>
</html>
