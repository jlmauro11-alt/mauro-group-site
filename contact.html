<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Mauro Group</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Background video -->
  <div class="bg">
    <video autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Navigation -->
  <header class="nav">
    <a class="brand" href="index.html">The Mauro Group</a>
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="investments.html">Investments</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Content -->
  <main class="wrap">
    <section class="panel">
      <h1>Contact</h1>
      <p class="sub">
        Send a note and we’ll respond quickly. If you have a deck or brief, include a link.
      </p>

      <!-- Email form -->
      <form
        class="form"
        action="mailto:private0@themaurogroup.com"
        method="post"
        enctype="text/plain"
      >
        <div>
          <label for="name">Name</label>
          <input
            id="name"
            name="Name"
            type="text"
            placeholder="Your name"
            required
          />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            id="email"
            name="Email"
            type="email"
            placeholder="you@company.com"
            required
          />
        </div>

        <div class="full">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="Message"
            placeholder="What can we help with?"
            required
          ></textarea>
        </div>

        <div class="full actions">
          <button class="btn primary" type="submit">Send Email</button>
          <span class="hint">
            This opens your email app and sends directly to
            private0@themaurogroup.com.
          </span>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
