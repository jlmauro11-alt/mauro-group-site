<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Mauro Group</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Top nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.95;
    }

    .brand img {
      height: 22px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 150ms ease;
    }

    .nav-links a:hover { color: rgba(255,255,255,0.98); }

    /* Hero */
    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 0 18px;
    }

    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      opacity: 0.75;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, #000 85%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 920px;
      padding: 24px;
      animation: fadeIn 900ms ease forwards;
      opacity: 0;
      transform: translateY(14px);
    }

    h1 {
      font-size: 3rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
      line-height: 1.1;
      text-shadow: 0 0 30px rgba(0,0,0,0.55);
    }

    p {
      font-size: 1.15rem;
      opacity: 0.82;
      line-height: 1.55;
      margin: 0 auto 1.4rem;
      max-width: 760px;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.35);
    }

    .btn.primary {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.35);
    }

    .btn.primary:hover {
      background: rgba(255,255,255,0.18);
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile tweaks */
    @media (max-width: 768px) {
      .nav { padding: 14px 16px; }
      .nav-links { gap: 12px; }
      .nav-links a { font-size: 0.9rem; }

      h1 { font-size: 2.05rem; }
      p  { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <a class="brand" href="index.html">
      <!-- optional logo: keep if you want -->
      <!-- <img src="assets/logo.svg" alt="The Mauro Group" /> -->
      <span>The Mauro Group</span>
    </a>

    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="investments.html">Investments</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Building the Technologies That Define Tomorrow</h1>
      <p>Advanced infrastructure, AI systems, and next-generation digital platforms.</p>

      <div class="cta-row">
        <a class="btn primary" href="about.html">Explore the Group</a>
        <a class="btn" href="contact.html">Get in Touch</a>
      </div>
    </div>
  </section>
</body>
</html>
