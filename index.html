<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Mauro Group</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Home hero overrides */
    body { overflow: hidden; }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 0 18px;
    }

    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120%;
      height: 120%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0.75;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, #000 85%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 920px;
      padding: 24px;
      animation: fadeIn 900ms ease forwards;
      opacity: 0;
      transform: translateY(14px);
    }

    .hero h1{
      font-size: 3rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 0.9rem;
      line-height: 1.1;
      text-shadow: 0 0 30px rgba(0,0,0,0.55);
    }

    .hero p{
      font-size: 1.15rem;
      opacity: 0.82;
      line-height: 1.55;
      margin: 0 auto 1.4rem;
      max-width: 760px;
    }

    @media (max-width: 768px){
      .hero h1{ font-size: 2.05rem; }
      .hero p{ font-size: 1rem; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <a class="brand" href="index.html">The Mauro Group</a>
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="investments.html">Investments</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4" />
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Building the Technologies That Define Tomorrow</h1>
      <p>Advanced infrastructure, AI systems, and next-generation digital platforms.</p>

      <div class="cta-row">
        <a class="btn primary" href="about.html">Explore the Group</a>
        <a class="btn" href="contact.html">Get in Touch</a>
      </div>
    </div>
  </section>
</body>
</html>
